name: Platform candidate (not parity certification)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: salescompel
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/salescompel?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/salescompel?sslmode=disable
      CANDIDATE_DISPOSABLE: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            compat/clients/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm ci --prefix compat/clients/node --ignore-scripts
      - run: npm ci --prefix web --ignore-scripts
      - run: npm --prefix compat/clients/node run check
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: |
          python -m venv compat/clients/python/.venv
          compat/clients/python/.venv/bin/pip install -r compat/clients/python/requirements.lock
      - run: scripts/check-candidate.sh
