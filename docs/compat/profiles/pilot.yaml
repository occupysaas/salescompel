schemaVersion: 1
id: pilot
description: Synthetic Sales Cloud/core platform; no live observations yet
apiVersion: null
clouds:
  - Sales Cloud
  - core platform
objects:
  - Account
  - Contact
  - User
fields:
  - Account.Compat_Text__c
  - Account.Compat_Key__c
personas:
  - administrator
  - restricted-user
requiredScenarios:
  - describe
  - crud
  - upsert
  - relationships
  - rollback
  - permissions
  - errors
  - locale
  - cli-query
  - metadata
  - python-crud
languages:
  - en_US
  - fr
  - de
  - pt_BR
  - iw
locales:
  - en_US
  - fr_FR
timezone: America/New_York
currency: USD
managedPackages: []
# Org-level features that change platform behavior. Synthetic values; a real
# source profile must record observed values during M0 inventory.
orgFeatures:
  personAccounts: false
  multiCurrency: false
  # Active legacy automation types still executing in the source org, e.g.
  # WorkflowRule, ProcessBuilder, AssignmentRule, AutoResponseRule,
  # EscalationRule.
  legacyAutomation: []
  # Names of External Service registrations that use OpenAPI 2.0. Migration
  # converts these, like 3.0 registrations, to the latest OpenAPI version
  # (contracts/external-services.yaml, external-openapi-conversion).
  externalServicesOpenApi2: []
# Exact client versions; validate checks these against the lockfiles and the
# installed CLI plugins, and compare requires both captures to match them.
connectors:
  jsforce: "3.11.0"
  "@salesforce/cli": "2.156.0"
  "@salesforce/plugin-data": "5.1.16"
  "@salesforce/plugin-deploy-retrieve": "4.2.15"
  simple-salesforce: "1.12.9"
referenceStatus: pending
# SalesCompel documents use the latest OpenAPI release; older Salesforce
# documents are converted to it.
openapi: "3.2"
