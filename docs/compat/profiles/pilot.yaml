schemaVersion: 1
id: pilot
description: Authorized disposable trial; synthetic Sales Cloud/core pilot; observations pending
apiVersion: "65.0"
clouds:
  - Sales Cloud
  - core platform
objects:
  - Account
  - Contact
  - User
fields:
  - Account.Compat_Text__c
  - Account.Compat_Key__c
personas:
  - administrator
  - restricted-user
requiredScenarios:
  - describe
  - crud
  - upsert
  - relationships
  - rollback
  - permissions
  - errors
  - locale
  - cli-query
  - metadata
  - python-crud
languages:
  - en_US
  - fr
  - de
  - pt_BR
locales:
  - en_US
  - fr_FR
timezone: America/New_York
currency: USD
managedPackages:
  - "Sales Insights 1.0.0.1"
  - "Salesforce Standard Data Model 1.132.0.1"
# Org-level feature inventory for this disposable reference tenant.
# Installed packages are environment context, not certified package coverage.
orgFeatures:
  personAccounts: false
  multiCurrency: false
  # Active legacy automation types still executing in the source org, e.g.
  # WorkflowRule, ProcessBuilder, AssignmentRule, AutoResponseRule,
  # EscalationRule.
  legacyAutomation: []
  # Names of External Service registrations that use OpenAPI 2.0. Migration
  # converts these, like 3.0 registrations, to the latest OpenAPI version
  # (contracts/external-services.yaml, external-openapi-conversion).
  externalServicesOpenApi2: []
# Exact client versions; validate checks these against the lockfiles and the
# installed CLI plugins, and compare requires both captures to match them.
connectors:
  jsforce: "3.11.0"
  "@salesforce/cli": "2.156.0"
  "@salesforce/plugin-data": "5.1.16"
  "@salesforce/plugin-deploy-retrieve": "4.2.15"
  simple-salesforce: "1.12.9"
# Salesforce CLI as a drop-in client (roadmap "Salesforce CLI as a drop-in
# client"). commands lists what the customer's pipelines invoke; the pilot
# lists what the laboratory harness runs. endpoint is native unless a
# hardcoded host forces the host-routing proxy; proxiedHosts records each one.
salesforceCli:
  channels:
    - npm
  endpoint: native
  proxiedHosts: []
  commands:
    - org login access-token
    - org display
    - data query
    - project deploy start
    - project retrieve start
# CLI plugins the customer's pipelines use. Versions must match connectors
# when the plugin is also pinned there.
cliPlugins:
  - name: "@salesforce/plugin-data"
    version: "5.1.16"
    source: core
    signature: bundled
    license: Apache-2.0
    commands:
      - data query
  - name: "@salesforce/plugin-deploy-retrieve"
    version: "4.2.15"
    source: core
    signature: bundled
    license: Apache-2.0
    commands:
      - project deploy start
      - project retrieve start
referenceStatus: pending
# SalesCompel documents use the latest OpenAPI release; older Salesforce
# documents are converted to it.
openapi: "3.2"
