schemaVersion: 1
status: documented-not-observed
owner: integration-runtime
sources:
  - external-services
  - external-examples
  - oas
  - external-registration-metadata
openapi: "3.2"
contracts:
  - id: external-servers-vs-named-credential
    milestone: M1/M8
    behavior: Callouts use the Named Credential endpoint as base URL and a
      relative schemaUrl resolves against it. How the spec's servers entries
      interact with that endpoint is unspecified; observe which wins when they
      disagree.
    preconditions:
      - Registered fixture whose servers URL differs from its Named Credential
        endpoint
      - Disposable external endpoint that records request URLs
    assertions:
      - Recorded callout host and path prefix identify the effective base URL
    observationStatus: not_run
  - id: external-openapi-conversion
    milestone: M0/M4/M5/M8
    behavior: SalesCompel stores, serves and executes only the latest OpenAPI
      version (3.2). Salesforce accepts only 2.0 and 3.0 registrations, so
      migration import and Metadata API deploy accept those as input and
      convert each to an equivalent latest-version document, retaining the
      original as a customer input artifact. Constructs that cannot be
      converted without changing behavior block the registration.
    preconditions:
      - Source org metadata retrieve including ExternalServiceRegistration
      - Fixture registrations authored in OpenAPI 2.0 and in 3.0
    assertions:
      - Each registration is reported with its source OpenAPI version
      - The converted 3.2 document validates and registers the same operation
        names, Flow/Apex input/output types, parameters, media types and
        Named Credential binding as the source registration
      - Invocations through the converted registration match the reference
        observations for the original
      - An unconvertible construct produces a named blocker, never a silent
        drop
    observationStatus: not_run
  - id: external-registration
    milestone: M4/M8
    behavior: Import bundled JSON/YAML OpenAPI 2.0/3.0 (the formats Salesforce
      accepts), register selected operations and preserve metadata
      dependencies
    preconditions:
      - Disposable reference org with External Services enabled
      - Bundled OpenAPI 3.0 document without external references
    assertions:
      - JSON and YAML forms of the same document register equivalent operations
      - Salesforce rejects 3.1/3.2 input as observed; SalesCompel accepts
        2.0/3.0 input and natively authored 3.2, storing only 3.2
      - Registration metadata retrieves with its Named Credential dependency
    observationStatus: not_run
  - id: external-schema
    milestone: M7/M8
    behavior: Capture nested objects, arrays, additionalProperties, headers and
      supported content types; distinguish schema validation from runtime
      behavior
    preconditions:
      - Registered synthetic External Services fixture
    assertions:
      - Each supported construct maps to the observed Flow/Apex type
      - Unsupported constructs produce the observed registration error
    observationStatus: not_run
  - id: external-server-variables
    milestone: M8
    behavior: Documentation says variables can register but are not substituted
      at runtime. Observe before claiming parity; offline standards validation
      must not pretend to certify callouts.
    preconditions:
      - Registered fixture whose server URL uses a variable
      - Disposable external endpoint that records request URLs
    assertions:
      - Recorded callout URL shows whether the variable was substituted
    observationStatus: not_run
  - id: external-credentials
    milestone: M4/M8
    behavior: Named Credential resolves endpoint; External Credential principal
      access gates callout. Secrets must be configured separately on import.
    preconditions:
      - Named and External Credential with a permission-set principal
      - One user with and one without principal access
    assertions:
      - User with principal access can invoke the operation
      - User without principal access receives the observed denial
      - Exported metadata contains no secret values
    observationStatus: not_run
  - id: external-invocation
    milestone: M7/M8
    behavior: Flow/Apex actions map typed inputs/outputs, nulls, errors and
      timeouts against a disposable external service
    preconditions:
      - Registered operation callable from Flow and Apex
      - Disposable external endpoint with scripted success, error, null and
        delayed responses
    assertions:
      - Typed outputs, nulls and HTTP errors surface as observed in Flow and Apex
      - Timeout behavior matches the observed limit and error
    observationStatus: not_run
