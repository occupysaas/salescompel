schemaVersion: 1
# extraction values:
#   reverify                  - listed as reviewed by an earlier pass, but the
#                               extracted content was not recorded; Salesforce
#                               documentation pages are often dynamic or refuse
#                               automated fetches. Re-read by hand and record a
#                               checksum or independent summary before relying
#                               on the claim (M0 exit gate).
#   not-extracted             - registered for a planned area; not yet read.
#   dynamic-body-unavailable  - fetch returned only an application shell.
#   documentation-reviewed    - content read and the claim confirmed.
#   downloaded-and-validated  - artifact pinned by commit/checksum and tested.
