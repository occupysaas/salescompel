schemaVersion: 1
cutoff: '2026-10-17'
profile: rest-query-foundation
status: blocked
reviewer: platform-implementer
findings:
  - id: winter23-query-cursor-retention
    status: reviewed-source-awaiting-live-reconciliation
    source: https://help.salesforce.com/s/articleView?id=release-notes.rn_api_improved_query_limits.htm&language=en_US&release=240&type=5
    corroboration: https://developer.salesforce.com/docs/platform/salesforce-app-limits-cheatsheet/guide/salesforce-app-limits-platform-apicursors.html
    release: Winter 23
    introducedApiVersion: '56.0'
    appliesTo: All API versions, including the selected REST API version.
    accessedAt: '2026-10-17'
    affectedContracts:
      - query-locator-lifecycle
    finding: Query results have a documented two-day availability window; the former ten-cursor and fifteen-minute inactivity constraints were removed.
    implication: The current sixteen-minute live probe can establish continued validity but cannot measure full expiry. Do not derive a fifteen-minute candidate lifetime from it.
    resolution: Retain the live bound as partial evidence and design a separately journaled long-duration expiry observation before freezing expiry semantics.
    blocksContractFreeze: true
blockers:
  - id: release-content-unavailable
    owner: platform-implementer
    affectedContracts:
      - query-response-shape
      - query-limit-above-batch
      - id-15-18
      - case-insensitive-names
      - case-insensitive-comparison
      - null-ordering
      - error-shape
      - unknown-sobject
    reason: Archive links were inventoried, but linked official PDFs could not be retrieved for content review.
    resolution: Retrieve release-pinned official HTML or PDFs, review supported-version behavior and enforced updates, and map findings to contracts and regression tests.
    blocksContractFreeze: true
  - id: linked-changelog-expansion
    owner: platform-implementer
    reason: Product/API changelogs and release-update links inside unread documents have not been inventoried.
    resolution: Expand the inventory as source content becomes accessible; retain missing-source owners and never claim complete M1R review from the archive link list.
    blocksFullM1R: true
accessChecks:
  - checkedAt: '2026-10-19'
    url: https://developer.salesforce.com/docs/platform/salesforce-app-limits-cheatsheet/guide/salesforce-app-limits-platform-apicursors.html
    version: current official API Query Cursor Limits guide; states change at API 56.0 and application to all REST versions including 65.0
    result: readable-html
    summary: Cursors and their results are documented as available for two days, including nested query results; the old per-user cursor limit and fifteen-minute inactivity expiry were removed. The page does not state a precise expiry boundary or retention anchor.
  - checkedAt: '2026-10-19'
    url: https://resources.docs.salesforce.com/latest/latest/en-us/sfdc/pdf/salesforce_app_limits_cheatsheet.pdf
    version: current official Developer Limits and Allocations Quick Reference PDF
    result: readable-pdf
    summary: Its API Query Cursor Limits section independently repeats two-day result availability and the API 56.0 cursor-limit change. It is current documentation, not a release-pinned Winter 23 review.
  - checkedAt: '2026-10-19'
    url: https://help.salesforce.com/s/articleView?id=release-notes.rn_api_improved_query_limits.htm&language=en_US&release=240&type=5
    version: Winter 23 release-pinned Help page
    result: inaccessible-content
    summary: The page exposed a loading and CSS-error shell; its release-note body could not be independently reread on this check. Earlier recorded evidence is retained.
  - checkedAt: '2026-10-19'
    url: https://developer.salesforce.com/blogs/2022/12/processing-large-amounts-of-data-with-apis-part-1-of-2
    version: December 2022 official developer article discussing Winter 23/API 56.0
    result: readable-html
    summary: The article separately describes up-to-two-day cursor availability and removal of the open-cursor limit. It does not establish a live expiry boundary.
