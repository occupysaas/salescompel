        and removal of old cursor limits; the pinned Winter 23 note remains unread.
      inference: "2026-10-21 clarification: prior long-duration resolution text is historical. Plan 10
        maintainer waiver controls; no wait over one hour is introduced. Exact boundary, clock anchor,
        eviction and later-retrieval effects stay unmeasured."
