openapi: 3.2.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: SalesCompel implemented candidate API
  version: 0.1.0
  description: Object and field API names are case-insensitive; responses use canonical names. REST body duplicates use the last value; case-differing Composite fields reject. Text equality uses simple Unicode case mapping without normalization. ORDER BY defaults to nulls first in both directions and honors NULLS FIRST or NULLS LAST. Independent candidate contract, not Salesforce parity certification. Only the listed canonical paths are implemented. Provisioned bearer credentials and OAuth login/refresh are supported. Field policy, Unicode/nonblank validation, SOQL execution, own-user identity and tenant isolation remain server checks. Null/omission and the columns extension reflect existing candidate behavior. Query pagination uses nextRecordsUrl and the query locator route. The locked query error vocabulary is MALFORMED_QUERY, INVALID_FIELD, INVALID_TYPE, INVALID_QUERY_FILTER_OPERATOR, QUERY_TOO_COMPLICATED and INVALID_QUERY_LOCATOR; messages never echo query values. No Bulk API or metadata deployment is provided. Tenant-defined custom objects and typed fields (text, numbers, currency, percent, dates, checkboxes, picklists, email, phone, URL, lookup, master-detail and auto-number) are resolved from persistent metadata; values are exact decimals, never binary floating point. Compound Name and Address fields are read-only. Formula, roll-up summary, encrypted, geolocation and rich text definitions are stored, not enforced, and never described. Schema changes use operator CLI commands; no Metadata API deployment is provided.
