              properties:
                attributes:
                  $ref: "#/components/schemas/AccountAttributes"
                Name:
                  type:
                    - string
                    - "null"
                  maxLength: 255
    Column:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - columnName
