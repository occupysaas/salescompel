          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
          description: Existing explicit projection, one equality filter, one ORDER BY and LIMIT 1..2000.
            Repeated q uses its first value; unknown query options are ignored.
        - name: columns
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            enum:
              - "true"
              - "false"
          description: Optional bounded CLI metadata extension; repeated or malformed values reject.
  /services/data/v65.0/openapi.yaml:
    get:
      operationId: candidateOpenAPI
      x-source:
        - https://github.com/occupysaas/salescompel/blob/272883beffc37b7597e02ef6e7ff54d3d55688d4/internal/platform/http.go
        - https://github.com/occupysaas/salescompel/blob/272883beffc37b7597e02ef6e7ff54d3d55688d4/docs/superpowers/specs/2026-11-04-plan-23-served-candidate-openapi-design.md
