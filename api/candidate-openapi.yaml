        "500":
          $ref: "#/components/responses/Error"
  /services/data/v65.0/composite:
    post:
      operationId: candidateCompositeAtomic
      description: "Restricted atomic Account/Contact writes: allOrNone must be true;
        collateSubrequests absent or false executes sequentially. Only earlier
        POST id references in row URLs and Contact.AccountId are supported. No
        partial success, reads, query, upsert, headers, or nested Composite.
        References and transaction effects are checked separately from schemas.
        Every result is rewritten on rollback; no committed success is reported
        before commit."
      x-source:
        - https://github.com/occupysaas/salescompel/blob/059bc87/docs/superpowers/specs/2026-11-04-plan-24-atomic-composite-writes-design.md
        - https://developer.salesforce.com/docs/platform/api-rest/guide/resources-composite-composite-post.html
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompositeRequest"
      responses:
        "200":
          description: Committed transaction or completely rolled-back subrequest failure;
            inspect every subresponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompositeResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/MethodError"
        "500":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Provisioned candidate token; no OAuth flow
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        fields:
          type: array
          items:
            type: string
    Errors:
      type: array
      items:
        $ref: "#/components/schemas/Error"
      minItems: 1
    AccountCreate:
      type: object
      additionalProperties: false
      required:
        - Name
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type:
            - string
            - "null"
          maxLength: 80
    AccountPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type:
            - string
            - "null"
          maxLength: 80
    AccountUpsert:
      type: object
      additionalProperties: false
      required: []
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type: "null"
    ContactCreate:
      type: object
      additionalProperties: false
      required:
        - LastName
      properties:
        FirstName:
          type:
            - string
            - "null"
          maxLength: 255
        LastName:
          type: string
          maxLength: 255
          minLength: 1
        AccountId:
          type:
            - string
            - "null"
          maxLength: 18
    ContactPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        FirstName:
          type:
            - string
            - "null"
          maxLength: 255
        LastName:
          type: string
          maxLength: 255
          minLength: 1
        AccountId:
          type:
            - string
            - "null"
          maxLength: 18
    CreateResult:
      type: object
      additionalProperties: false
      required:
        - id
        - success
        - errors
      properties:
        id:
          type: string
          minLength: 1
        success:
          const: true
        errors:
          type: array
          maxItems: 0
    UpsertResult:
      type: object
      additionalProperties: false
      required:
        - id
        - created
        - success
        - errors
      properties:
        id:
          type: string
          minLength: 1
        created:
          type: boolean
        success:
          const: true
        errors:
          type: array
          maxItems: 0
    AccountAttributes:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: Account
        url:
          type: string
    ContactAttributes:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: Contact
        url:
          type: string
    AccountRead:
      type: object
      additionalProperties: false
      required:
        - attributes
        - Id
        - Name
        - Compat_Key__c
      properties:
        attributes:
          $ref: "#/components/schemas/AccountAttributes"
        Id:
          type: string
          minLength: 1
        Name:
          type: string
          maxLength: 255
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type:
            - string
            - "null"
          maxLength: 80
    ContactRead:
      type: object
      additionalProperties: false
      required:
        - attributes
        - Id
        - FirstName
        - LastName
        - AccountId
      properties:
        attributes:
          $ref: "#/components/schemas/ContactAttributes"
        Id:
          type: string
          minLength: 1
        FirstName:
          type:
            - string
            - "null"
          maxLength: 255
        LastName:
          type: string
