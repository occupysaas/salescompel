        - fields
        - createable
        - updateable
        - deletable
        - queryable
      properties:
        name:
          enum:
            - Account
            - Contact
        label:
          type: string
          minLength: 1
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"
        createable:
          const: true
        updateable:
          const: true
        deletable:
