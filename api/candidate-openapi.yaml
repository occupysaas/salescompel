      maxItems: 1
    Resources:
      type: object
      additionalProperties: false
      required:
        - sobjects
        - query
        - openapi
        - composite
      properties:
        sobjects:
          const: /services/data/v65.0/sobjects
        query:
          const: /services/data/v65.0/query
        openapi:
          const: /services/data/v65.0/openapi.yaml
        composite:
