openapi: 3.2.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: SalesCompel implemented candidate API
  version: 0.1.0
  description: Object and field API names are case-insensitive; responses use canonical names. REST body duplicates use the last value; case-differing Composite fields reject. Text equality uses simple Unicode case mapping without normalization. ORDER BY defaults to nulls first in both directions and honors NULLS FIRST or NULLS LAST. Independent candidate contract, not Salesforce parity certification. Only the listed
    canonical paths are implemented. Provisioned bearer credentials are not OAuth login/refresh.
    Field policy, Unicode/nonblank validation, SOQL execution, own-user identity and tenant
    isolation remain server checks. Null/omission and the columns extension reflect existing
    candidate behavior. No Composite, collections, Bulk, pagination or metadata deployment is
    provided.
