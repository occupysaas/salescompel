          description: Decoded once; trim leading and trailing ASCII spaces, apply NFC, full case folding, then NFC. Lookup and tenant uniqueness use this equivalence; upsert updates preserve stored spelling. Whitespace-only keys return 400 INVALID_FIELD.
          in: path
          required: true
          style: simple
          explode: false
