components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Provisioned candidate token; no OAuth flow
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        fields:
          type: array
          items:
            type: string
    Errors:
      type: array
      items:
        $ref: "#/components/schemas/Error"
      minItems: 1
    AccountCreate:
      type: object
      additionalProperties: false
      required:
        - Name
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type:
            - string
            - "null"
          maxLength: 80
    AccountPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type:
            - string
            - "null"
          maxLength: 80
    AccountUpsert:
      type: object
      additionalProperties: false
      required: []
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type: "null"
    ContactCreate:
      type: object
      additionalProperties: false
      required:
        - LastName
      properties:
        FirstName:
          type:
            - string
            - "null"
          maxLength: 255
        LastName:
          type: string
          maxLength: 255
          minLength: 1
        AccountId:
          type:
            - string
            - "null"
          maxLength: 18
    ContactPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        FirstName:
          type:
            - string
            - "null"
          maxLength: 255
        LastName:
          type: string
          maxLength: 255
          minLength: 1
        AccountId:
          type:
            - string
            - "null"
          maxLength: 18
    CreateResult:
      type: object
      additionalProperties: false
      required:
        - id
        - success
        - errors
      properties:
        id:
          type: string
          minLength: 1
        success:
          const: true
        errors:
          type: array
          maxItems: 0
    UpsertResult:
      type: object
      additionalProperties: false
      required:
        - id
        - created
        - success
        - errors
      properties:
        id:
          type: string
          minLength: 1
        created:
          type: boolean
        success:
          const: true
        errors:
          type: array
          maxItems: 0
    AccountAttributes:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: Account
        url:
          type: string
    ContactAttributes:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: Contact
        url:
          type: string
    AccountRead:
      type: object
      additionalProperties: false
      required:
        - attributes
        - Id
        - Name
        - Compat_Key__c
      properties:
        attributes:
          $ref: "#/components/schemas/AccountAttributes"
        Id:
          type: string
          minLength: 1
        Name:
          type: string
          maxLength: 255
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type:
            - string
            - "null"
          maxLength: 80
    ContactRead:
      type: object
      additionalProperties: false
      required:
        - attributes
        - Id
        - FirstName
        - LastName
        - AccountId
      properties:
        attributes:
          $ref: "#/components/schemas/ContactAttributes"
        Id:
          type: string
          minLength: 1
        FirstName:
          type:
            - string
            - "null"
          maxLength: 255
        LastName:
          type: string
          maxLength: 255
        AccountId:
          type:
            - string
            - "null"
          maxLength: 18
    AccountProjection:
      type: object
      additionalProperties: false
      required:
        - attributes
      properties:
        attributes:
          $ref: "#/components/schemas/AccountAttributes"
        Id:
          type: string
          minLength: 1
        Name:
          type: string
          maxLength: 255
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type:
            - string
            - "null"
          maxLength: 80
    ContactProjection:
      type: object
      additionalProperties: false
      required:
        - attributes
      properties:
        attributes:
          $ref: "#/components/schemas/ContactAttributes"
        Id:
          type: string
          minLength: 1
        FirstName:
          type:
            - string
            - "null"
          maxLength: 255
        LastName:
          type: string
          maxLength: 255
        AccountId:
          type:
            - string
            - "null"
          maxLength: 18
        Account:
          anyOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required:
                - attributes
                - Name
              properties:
                attributes:
                  $ref: "#/components/schemas/AccountAttributes"
                Name:
                  type:
                    - string
                    - "null"
                  maxLength: 255
    Column:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - columnName
          properties:
            columnName:
              enum:
                - Id
                - Name
                - Compat_Text__c
                - Compat_Key__c
                - FirstName
                - LastName
                - AccountId
        - type: object
          additionalProperties: false
          required:
            - columnName
            - joinColumns
          properties:
            columnName:
              const: Account
            joinColumns:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - columnName
                properties:
                  columnName:
                    const: Name
              minItems: 1
              maxItems: 1
    QueryResult:
      type: object
      additionalProperties: false
      required:
        - done
        - totalSize
        - records
      properties:
        done:
          const: true
        totalSize:
          type: integer
          minimum: 0
        records:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/AccountProjection"
              - $ref: "#/components/schemas/ContactProjection"
        columnMetadata:
          type: array
          items:
            $ref: "#/components/schemas/Column"
    Field:
      type: object
      additionalProperties: false
      required:
        - name
        - label
        - type
        - nillable
        - createable
        - updateable
        - externalId
        - length
