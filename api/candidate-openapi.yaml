          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthIntrospectRequest'
  /services/oauth2/authorize:
    get:
      operationId: candidateOAuthAuthorizeForm
      x-source:
      - https://github.com/occupysaas/salescompel/blob/bf67743aca880baba1b3bc8ed1e91a4c7a83c4fa/internal/platform/oauth_page.go
      responses:
        '200':
          description: Candidate OAuth response
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/OAuthHTML'
        '302':
          description: Candidate OAuth response
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/OAuthHTML'
        '400':
          description: Candidate OAuth response
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/OAuthHTML'
      security: []
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
      - name: response_type
        in: query
        required: true
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
      - name: prompt
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
    post:
      operationId: candidateOAuthAuthorizeSubmit
      x-source:
      - https://github.com/occupysaas/salescompel/blob/bf67743aca880baba1b3bc8ed1e91a4c7a83c4fa/internal/platform/oauth_page.go
      responses:
        '200':
          description: Candidate OAuth response
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/OAuthHTML'
        '303':
          description: Redirect to registered callback
        '400':
          description: Candidate OAuth response
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/OAuthHTML'
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '500':
          description: Candidate OAuth response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthAuthorizeRequest'
  /.well-known/openid-configuration:
    get:
      operationId: candidateOAuthDiscovery
      x-source:
      - https://github.com/occupysaas/salescompel/blob/bf67743aca880baba1b3bc8ed1e91a4c7a83c4fa/internal/platform/oauth_http.go
      responses:
        '200':
          description: Candidate OAuth response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthDiscovery'
        '405':
          $ref: '#/components/responses/MethodError'
      security: []
  /id/{orgId}/{userId}:
    get:
      operationId: candidateOAuthIdentity
      x-source:
      - https://github.com/occupysaas/salescompel/blob/bf67743aca880baba1b3bc8ed1e91a4c7a83c4fa/internal/platform/oauth_http.go
      responses:
        '200':
          description: Candidate OAuth response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthIdentity'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Provisioned candidate token; no OAuth flow
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /services/oauth2/authorize
          tokenUrl: /services/oauth2/token
          refreshUrl: /services/oauth2/token
          scopes:
            api: Data API
            id: Identity
            refresh_token: Refresh access
        clientCredentials:
          tokenUrl: /services/oauth2/token
          scopes:
            api: Data API
            id: Identity
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        fields:
          type: array
          items:
            type: string
    Errors:
      type: array
      items:
        $ref: "#/components/schemas/Error"
      minItems: 1
    AccountCreate:
      type: object
      additionalProperties: false
      required:
        - Name
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type:
            - string
            - "null"
          maxLength: 80
    AccountPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type:
            - string
            - "null"
          maxLength: 80
    AccountUpsert:
      type: object
      additionalProperties: false
      required: []
      properties:
        Name:
          type: string
          maxLength: 255
          minLength: 1
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type: "null"
    ContactCreate:
      type: object
      additionalProperties: false
      required:
        - LastName
      properties:
        FirstName:
          type:
            - string
            - "null"
          maxLength: 255
        LastName:
          type: string
          maxLength: 255
          minLength: 1
        AccountId:
          type:
            - string
            - "null"
          maxLength: 18
    ContactPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        FirstName:
          type:
            - string
            - "null"
          maxLength: 255
        LastName:
          type: string
          maxLength: 255
          minLength: 1
        AccountId:
          type:
            - string
            - "null"
          maxLength: 18
    CreateResult:
      type: object
      additionalProperties: false
      required:
        - id
        - success
        - errors
      properties:
        id:
          type: string
          minLength: 1
        success:
          const: true
        errors:
          type: array
          maxItems: 0
    UpsertResult:
      type: object
      additionalProperties: false
      required:
        - id
        - created
        - success
        - errors
      properties:
        id:
          type: string
          minLength: 1
        created:
          type: boolean
        success:
          const: true
        errors:
          type: array
          maxItems: 0
    AccountAttributes:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: Account
        url:
          type: string
    ContactAttributes:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: Contact
        url:
          type: string
    AccountRead:
      type: object
      additionalProperties: false
      required:
        - attributes
        - Id
        - Name
        - Compat_Key__c
      properties:
        attributes:
          $ref: "#/components/schemas/AccountAttributes"
        Id:
          type: string
          minLength: 1
        Name:
          type: string
          maxLength: 255
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type:
            - string
            - "null"
          maxLength: 80
    ContactRead:
      type: object
      additionalProperties: false
      required:
        - attributes
        - Id
        - FirstName
        - LastName
        - AccountId
      properties:
        attributes:
          $ref: "#/components/schemas/ContactAttributes"
        Id:
          type: string
          minLength: 1
        FirstName:
          type:
            - string
            - "null"
          maxLength: 255
        LastName:
          type: string
          maxLength: 255
        AccountId:
          type:
            - string
            - "null"
          maxLength: 18
    AccountProjection:
      type: object
      additionalProperties: false
      required:
        - attributes
      properties:
        attributes:
          $ref: "#/components/schemas/AccountAttributes"
        Id:
          type: string
          minLength: 1
        Name:
          type: string
          maxLength: 255
        Compat_Text__c:
          type:
            - string
            - "null"
          maxLength: 80
        Compat_Key__c:
          type:
            - string
            - "null"
          maxLength: 80
    ContactProjection:
